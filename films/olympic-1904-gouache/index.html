<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fa;src:url(assets/Arabic.ttf)}*{box-sizing:border-box}body{margin:0;background:#1D1B1E;overflow:hidden}#stage{position:absolute;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden}canvas{position:absolute;inset:0;width:1080px;height:1920px}#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 40%,#1d1b1e45 100%);pointer-events:none}#title{position:absolute;top:190px;left:90px;right:90px;text-align:center;font:900 90px/1.52 Fa;color:#1D1B1E;direction:rtl;white-space:pre-line;text-shadow:0 1px 0 #F1C565;-webkit-text-stroke:1.5px #F1C565;paint-order:stroke fill}#kicker{position:absolute;top:138px;left:100px;right:100px;text-align:center;font:500 32px Fa;letter-spacing:1px;direction:rtl;color:#48505E}#caption{position:absolute;bottom:230px;left:90px;right:110px;background:#1d1b1eeb;color:#fff5d8;padding:20px 28px 25px;clip-path:polygon(1% 5%,98% 0,100% 91%,2% 100%,0 42%);font:700 49px/1.7 Fa;text-align:center;direction:rtl;white-space:pre-line;border-top:4px solid #f1c565}#rule{position:absolute;height:5px;width:100px;top:530px;left:490px;background:#D97757}
</style></head><body><div id="stage"><canvas id="paint" width="1080" height="1920"></canvas><div id="vignette"></div><div id="kicker"></div><div id="title"></div><div id="rule"></div><div id="caption"></div></div><script>
const C=document.getElementById('paint'),g=C.getContext('2d'),bg=new Image(),hero=new Image(),sprites=new Image();sprites.src='assets/runners-rear-v2.png';bg.src='assets/stadium.png';hero.src='assets/felix.png';
const stage=document.querySelector('#stage'),title=document.querySelector('#title'),cap=document.querySelector('#caption'),kicker=document.querySelector('#kicker'),rule=document.querySelector('#rule');
function rnd(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function clamp(v){return Math.max(0,Math.min(1,v))}function ease(v){return 1-(1-clamp(v))**3}
// Geometry is in the stadium painting's 1080x1920 coordinates.
// Both the painting and the runners receive the SAME camera transform.
const ROAD={p0:[440,1250],p1:[430,1140],p2:[690,965],p3:[1050,900]};
function roadAt(u){const v=1-u,p=ROAD;return{x:v*v*v*p.p0[0]+3*v*v*u*p.p1[0]+3*v*u*u*p.p2[0]+u*u*u*p.p3[0],y:v*v*v*p.p0[1]+3*v*v*u*p.p1[1]+3*v*u*u*p.p2[1]+u*u*u*p.p3[1],dx:3*v*v*(p.p1[0]-p.p0[0])+6*v*u*(p.p2[0]-p.p1[0])+3*u*u*(p.p3[0]-p.p2[0]),dy:3*v*v*(p.p1[1]-p.p0[1])+6*v*u*(p.p2[1]-p.p1[1])+3*u*u*(p.p3[1]-p.p2[1])};}
function runnerStates(t){return Array.from({length:7},(_,i)=>{const u=.07+i*.095+t*.045,pt=roadAt(u),lane=[-1,1,0][i%3]*12*(1-u),len=Math.hypot(pt.dx,pt.dy);return{id:i,u,x:pt.x-pt.dy/len*lane,y:pt.y+pt.dx/len*lane,h:190-145*u,phase:i*.63,heading:Math.atan2(pt.dy,pt.dx)};}).sort((a,b)=>a.y-b.y);}
function paintedRunner(r,t){const frame=Math.floor(t*8+r.phase*2)%4,sw=sprites.width/4,w=r.h*sw/sprites.height;g.fillStyle='#1d1b1e25';g.beginPath();g.ellipse(r.x,r.y-1,r.h*.19,r.h*.025,0,0,7);g.fill();g.drawImage(sprites,frame*sw,0,sw,sprites.height,r.x-w/2,r.y-r.h,w,r.h);}
function roadDust(r,t){for(let k=0;k<4;k++){const age=(t*.8+r.phase+k*.25)%1;g.globalAlpha=(1-age)*.09;g.fillStyle='#F1C565';g.beginPath();g.ellipse(r.x-8-age*28,r.y+age*13,3+age*12,1+age*5,-.3,0,7);g.fill();}g.globalAlpha=1;}
function cameraFor(t){if(t<(101/30))return{s:1.18-.025*t/(101/30),dx:t*5,dy:-14};if(t<(176/30))return{s:1.65,dx:-245-(t-(101/30))*9,dy:90};return{s:1.78+(t-(176/30))*.012,dx:-285-(t-(176/30))*5,dy:105};}
function paintWorld(t,camera){g.save();g.translate(540+camera.dx,960+camera.dy);g.scale(camera.s,camera.s);g.translate(-540,-960);g.drawImage(bg,0,0,1080,1920);const runners=runnerStates(t);runners.forEach(r=>roadDust(r,t));runners.forEach(r=>paintedRunner(r,t));g.restore();}
function landscape(scale,dx,dy){g.save();g.translate(540+dx,960+dy);g.scale(scale,scale);g.drawImage(bg,-540,-960,1080,1920);g.restore()}
const CUES=[
 {t0:0,t1:2.966667,text:'کمدی‌ترین مسابقهٔ\nتاریخ المپیک!'},
 {t0:(101/30),t1:5.80,text:'المپیک ۱۹۰۴ آمریکا'},
 {t0:(176/30),t1:6.966667,text:'دوی ماراتون!'},
 {t0:7.10,t1:10,text:'۱۸ نفر نتونستن\nمسابقه رو تموم کنن!'}
];
const query=new URLSearchParams(location.search);window.DUR=10;window.runnerStates=runnerStates;window.roadAt=roadAt;window.ROAD=ROAD;window.CUES=CUES;window.cameraFor=cameraFor;
window.render=t=>{t=Math.min(9.999999,Math.max(0,t));stage.style.transform=`scale(${innerWidth/1080},${innerHeight/1920})`;g.clearRect(0,0,1080,1920);const shot=t<(101/30)?0:t<(176/30)?1:2;paintWorld(t,cameraFor(t));
 title.style.color='#1D1B1E';kicker.style.color='#1D1B1E';
 if(shot===0){title.textContent='کمدی‌ترین مسابقهٔ\nتاریخ المپیک!';title.style.fontSize='84px';kicker.textContent='یک داستان واقعی';rule.style.top='530px';}
 else if(shot===1){title.textContent='آمریکا • ۱۹۰۴';title.style.fontSize='96px';kicker.textContent='المپیک سنت‌لوئیس';rule.style.top='405px';}
 else{title.textContent='دوی ماراتون';title.style.fontSize='90px';kicker.textContent='المپیک ۱۹۰۴';rule.style.top='405px';}
 const c=CUES.find(c=>t>=c.t0-.000001&&t<c.t1-.000001);cap.style.opacity=c?1:0;if(c)cap.textContent=c.text;
 if(query.has('debug')){g.save();const cam=cameraFor(t);g.translate(540+cam.dx,960+cam.dy);g.scale(cam.s,cam.s);g.translate(-540,-960);g.strokeStyle='#ef289b';g.lineWidth=4;g.beginPath();g.moveTo(...ROAD.p0);g.bezierCurveTo(...ROAD.p1,...ROAD.p2,...ROAD.p3);g.stroke();runnerStates(t).forEach(r=>{g.fillStyle='#ef289b';g.beginPath();g.arc(r.x,r.y,4,0,7);g.fill();});g.restore();}
};Promise.all([bg.decode(),hero.decode(),sprites.decode(),document.fonts.load('700 50px Fa')]).then(()=>{window.render(0);window.READY=true});
</script><script src="part02.js"></script><script src="part03.js"></script><script src="part04.js"></script></body></html>
