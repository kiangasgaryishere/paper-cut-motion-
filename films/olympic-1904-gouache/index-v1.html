<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fa;src:url(assets/Arabic.ttf)}*{box-sizing:border-box}body{margin:0;background:#1D1B1E;overflow:hidden}#stage{position:absolute;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden}canvas{position:absolute;inset:0;width:1080px;height:1920px}#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,transparent 40%,#1d1b1e45 100%);pointer-events:none}#title{position:absolute;top:190px;left:90px;right:90px;text-align:center;font:900 90px/1.52 Fa;color:#1D1B1E;direction:rtl;white-space:pre-line;text-shadow:0 2px 0 #f1c56566}#kicker{position:absolute;top:138px;left:100px;right:100px;text-align:center;font:500 32px Fa;letter-spacing:1px;direction:rtl;color:#48505E}#caption{position:absolute;bottom:230px;left:90px;right:110px;background:#1d1b1eeb;color:#fff5d8;padding:20px 28px 25px;clip-path:polygon(1% 5%,98% 0,100% 91%,2% 100%,0 42%);font:700 49px/1.7 Fa;text-align:center;direction:rtl;white-space:pre-line;border-top:4px solid #f1c565}#rule{position:absolute;height:5px;width:100px;top:530px;left:490px;background:#D97757}
</style></head><body><div id="stage"><canvas id="paint" width="1080" height="1920"></canvas><div id="vignette"></div><div id="kicker"></div><div id="title"></div><div id="rule"></div><div id="caption"></div></div><script>
const C=document.getElementById('paint'),g=C.getContext('2d'),bg=new Image(),hero=new Image(),sprites=new Image();sprites.src='assets/runners.png';bg.src='assets/stadium.png';hero.src='assets/felix.png';
const stage=document.querySelector('#stage'),title=document.querySelector('#title'),cap=document.querySelector('#caption'),kicker=document.querySelector('#kicker'),rule=document.querySelector('#rule');
function rnd(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function clamp(v){return Math.max(0,Math.min(1,v))}function ease(v){return 1-(1-clamp(v))**3}
// Four painted key poses cycle at eight drawings/second with staggered phases.
function runner(x,y,s,t,phase,shirt){
 const frame=((Math.floor(t*8+phase*2)%4)+4)%4,sw=sprites.width/4,h=280*s,w=h*sw/sprites.height;
 g.save();g.translate(x,y);g.fillStyle='#1d1b1e26';g.beginPath();g.ellipse(0,0,45*s,7*s,0,0,7);g.fill();g.drawImage(sprites,frame*sw,0,sw,sprites.height,-w/2,-h,w,h);g.restore();
}
function dust(t,heavy){for(let i=0;i<(heavy?38:20);i++){let age=(t*.42+rnd(i+200))%1,x=120+rnd(i+10)*850-age*100,y=(heavy?1290:1340)+rnd(i+40)*260-age*50;g.globalAlpha=(1-age)*.13;g.fillStyle='#F1C565';g.beginPath();g.ellipse(x,y,12+rnd(i+80)*35,4+rnd(i+100)*10,-.1,0,7);g.fill()}g.globalAlpha=1}
function landscape(scale,dx,dy){g.save();g.translate(540+dx,960+dy);g.scale(scale,scale);g.drawImage(bg,-540,-960,1080,1920);g.restore()}
window.DUR=10;window.render=t=>{t=Math.min(9.999,Math.max(0,t));stage.style.transform=`scale(${innerWidth/1080},${innerHeight/1920})`;g.clearRect(0,0,1080,1920);const shot=t<3?0:t<6?1:2,age=t-[0,3,6][shot];
title.style.color=shot===1?'#fff5d8':'#1D1B1E';kicker.style.color=shot===1?'#F1C565':'#48505E';
if(shot===0){landscape(1.18-.035*age/3,8*age,-14);for(let i=0;i<8;i++)runner(430+i*57-age*12,1180+i*17,.21+i*.018,t,i*.8,['#D97757','#e2ce9c','#48505E'][i%3]);dust(t,false);title.textContent='کمدی‌ترین مسابقهٔ\nتاریخ المپیک!';title.style.fontSize='90px';kicker.textContent='یک داستان واقعی';cap.style.opacity='0';rule.style.top='530px';}
else if(shot===1){landscape(1.45,-120-age*33,-240);for(let i=0;i<5;i++)runner(110+i*210+Math.sin(age*.4)*20,1390+(i%2)*85,.78+(i%2)*.10,t,i*.83,['#D97757','#ddd0ac','#86A03F','#48505E','#dbc69c'][i]);dust(t,true);title.textContent='آمریکا • ۱۹۰۴';title.style.fontSize='96px';kicker.textContent='دوی ماراتون المپیک';cap.style.opacity='1';cap.textContent='۱۸ نفر نتونستن\nمسابقه رو تموم کنن!';rule.style.top='405px';}
else{landscape(1.30+age*.009,-90-age*8,-20);for(let i=0;i<4;i++)runner(140+i*230-age*28,1180+(i%2)*35,.27,t,i,['#ddd0ac','#48505E'][i%2]);g.fillStyle='#1d1b1e38';g.beginPath();g.ellipse(548,1480,180,22,0,0,7);g.fill();let h=1000+ease(age/4)*35,w=h*hero.width/hero.height;g.save();g.translate(540+Math.sin(age*.6)*3,1480);g.rotate(Math.sin(age*1.7)*.004);g.drawImage(hero,-w/2,-h+Math.sin(age*2)*2,w,h);g.restore();dust(t,false);title.textContent='فلیکس کارواخال';title.style.fontSize='88px';kicker.textContent='اولین شخصیت این ماجرا';cap.style.opacity='1';cap.textContent='دوندهٔ کوبایی؛\nبا همین لباس‌ها!';rule.style.top='405px';}
};Promise.all([bg.decode(),hero.decode(),sprites.decode(),document.fonts.load('700 50px Fa')]).then(()=>{window.render(0);window.READY=true});
</script></body></html>
