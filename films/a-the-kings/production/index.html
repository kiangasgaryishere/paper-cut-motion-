<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:Arabic;src:url(Arabic.ttf)}@font-face{font-family:Latin;src:url(Latin.ttf)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eae3d3}#stage{position:absolute;width:1080px;height:1920px;transform-origin:top left;overflow:hidden;background:#eae3d3 url(paper.jpg) center/cover}.scene{position:absolute;inset:0;transform-origin:540px 860px}.scene svg{width:1080px;height:1920px;overflow:visible}#shade{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 35%,transparent 30%,rgba(67,53,30,.12));pointer-events:none}#caption{position:absolute;left:100px;right:150px;bottom:260px;text-align:center;color:#fbf7ed;pointer-events:none}#fa{font:46px/1.85 Arabic,Latin,sans-serif;background:rgba(30,37,32,.96);padding:10px 22px 14px;border-radius:9px;box-shadow:0 6px 18px #24292318}#en{font:27px/1.45 Latin,sans-serif;direction:ltr;color:#eee7d8;margin-top:9px;padding:8px 20px;background:rgba(30,37,32,.9);border-radius:6px}bdi{font-family:Latin}
#visual-root{position:absolute;inset:0;clip-path:inset(400px 0 590px 0)}#en{display:none!important}#title{height:180px;max-height:180px;overflow:hidden;padding-top:18px;position:absolute;left:105px;right:130px;top:150px;direction:rtl;color:#242923;font:700 60px/1.4 Arabic,Latin,sans-serif;text-align:center;border-bottom:3px solid #bf873d;padding-bottom:16px}#title bdi{font-size:1.06em}</style><div id="stage"><div id="visual-root"><div id="previous" class="scene"></div><div id="current" class="scene"></div></div><div id="shade"></div><div id="title"></div><div id="caption"><div id="fa" dir="rtl"></div><div id="en" dir="ltr"></div></div></div><script src="data.js"></script><script>
const stage=document.querySelector('#stage'),prev=document.querySelector('#previous'),cur=document.querySelector('#current');
let last=-99,previous=-99;
const clamp=x=>Math.min(1,Math.max(0,x)),ease=x=>1-Math.pow(1-clamp(x),3),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
function mount(node,i){node.replaceChildren();if(i<0)return;let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 1080 1920');svg.innerHTML=ART[i];let defs=svg.querySelector('defs');let elements=[...svg.children].filter(e=>e!==defs);elements.forEach((e,k)=>{let g=document.createElementNS(svg.namespaceURI,'g');e.replaceWith(g);g.append(e);g.classList.add('piece');g.dataset.n=k});let fit=document.createElementNS(svg.namespaceURI,'g');fit.classList.add('art-fit');[...svg.children].filter(e=>e!==defs).forEach(e=>fit.append(e));svg.append(fit);node.append(svg);let b=fit.getBBox();let pad=[7,9].includes(i)?120:70;let sc=Math.min(1.35,870/(b.width+pad),820/(b.height+70));fit.setAttribute('transform',`translate(520 865) scale(${sc}) translate(${-b.x-b.width/2} ${-b.y-b.height/2})`);}
function pose(node,i,t,hold=false){if(i<0)return;const s=SHOTS[i],age=Math.max(0,t-s.start),len=s.end-s.start;const progress=clamp(age/len);let zoom=1+.018*ease(progress);if(i===0)zoom=1.06-.06*ease(age/1.1);let pan=[6,7,8].includes(i)?22*(progress-.5):0;node.style.transform=`translate(${pan}px,${-5*progress}px) scale(${zoom})`;
node.querySelectorAll('.piece').forEach((g,k)=>{let delay=Math.min(k*.035,.12),enter=ease((age-delay)/.35);let offset=(1-enter)*((k%2?1:-1)*56),dy=(1-enter)*52;let rot=(1-enter)*(k%2?2:-2);if(i===0){enter=1;offset=0;dy=0;rot=0;}g.setAttribute('transform',`translate(${offset} ${dy}) rotate(${rot} 540 880)`);g.style.opacity=enter;});
if(i===0){for(const [cls,on] of [['.hook-card-a',META.hook_a_at],['.hook-card-the',META.hook_the_at]]){const e=node.querySelector(cls);if(e){let v=ease((t-on)/.2)*(1-.25*smooth((t-on-.8)/.4));e.style.translate=`0px ${-14*v}px`;const r=e.querySelector('rect');if(r){r.setAttribute('stroke',v>.1?'#bf873d':'#c6b99d');r.setAttribute('stroke-width',v>.1?'8':'3');}}}}
if(i===6){const ship=node.querySelector('.norwegian-ship');if(ship)ship.style.translate=`${-15*ease(age/1.3)}px ${3*Math.sin(age*3)}px`;}
if(i===7){const loser=node.querySelector('.norway-defeated');if(loser)loser.setAttribute('transform',`rotate(${38*ease((age-.25)/.8)} 740 1060)`);}
if(i===9){const fallen=node.querySelector('.harold-fallen');if(fallen)fallen.setAttribute('transform',`translate(0 ${120*ease((age-.12)/.85)}) rotate(${88*ease((age-.12)/.85)} 540 1000)`);}
if(i===13){const q=node.querySelector('.an-to-a');if(q)q.style.opacity=ease((t-META.a_root_at)/.35);}
if(i===14){const q=node.querySelector('.deictic-example');if(q)q.style.opacity=ease((t-META.the_point_at)/.4);}
if(i===13){node.style.transform+=` translateY(${-24*smooth((age-3.4)/.6)}px)`;}
if(i===16){const q=node.querySelector('.window-focus');if(q)q.style.opacity=ease((age-.3)/.5);}
if(i===17){const pen=node.querySelector('.pen');if(pen){pen.style.opacity=ease((age-.6)/.4);pen.style.translate=`${-20*smooth((age-1)/1)}px ${12*Math.sin(age*5)}px`;}}
if(i===18){const word=node.querySelector('.comment-keyword');if(word){const begin=META.comment_keyword_at,count=Math.min(3,Math.max(0,Math.floor((t-begin)/.13)+1));word.style.opacity=t>=begin?1:0;const text=word.querySelector('text');if(text)text.textContent='THE'.slice(0,count);const caret=word.querySelector('.typing-caret');if(caret&&text){const x=403+text.getComputedTextLength()+9;caret.setAttribute('x1',x);caret.setAttribute('x2',x);caret.style.opacity=t<SHOTS[i].start+1.4&&Math.floor((t-begin)*7)%2===0?1:0;}}const check=node.querySelector('.sent-check'),button=node.querySelector('.send-button');if(check)check.style.opacity=smooth((age-1.4)/.25);if(button)button.style.opacity=1-smooth((age-1.4)/.25);}
let rings=node.querySelectorAll('circle[fill="none"]');rings.forEach(r=>{r.style.opacity=ease((age-.6)/.6)});
node.querySelectorAll('path[stroke-dasharray]').forEach(e=>{e.style.strokeDashoffset=String(-age*18);if(i===15)e.style.opacity=ease((age-3)/.7)});
}
function isolate(s){return s.replace(/[A-Za-zĀā]+(?:[ .]+[A-Za-zĀā]+)*/g,m=>`<bdi dir="ltr">${m}</bdi>`)}
const params=new URLSearchParams(location.search),offset=Number(params.get("range_start")||0);window.DUR=params.has("range_end")?Number(params.get("range_end"))-offset:params.has("preview")?8:META.render_duration;window.render=t=>{t+=offset;
stage.style.transform=`scale(${innerWidth/1080},${innerHeight/1920})`;
let i=-1;for(let k=0;k<SHOTS.length;k++)if(t>=SHOTS[k].start)i=k;
if(i!==last){mount(cur,i);mount(prev,i-1);last=i;previous=i-1}
if(i>=0){pose(cur,i,t);pose(prev,i-1,SHOTS[i].start,true);const age=t-SHOTS[i].start;cur.style.opacity=1;
if([0,2,6,7,9,12,18].includes(i)){cur.style.clipPath='none';prev.style.opacity=0;}
else if([10,14].includes(i)){const p=smooth(age/.28);cur.style.clipPath='none';cur.style.opacity=p;prev.style.opacity=1-p;}
else if([4,8].includes(i)){const p=smooth(age/.32);cur.style.clipPath=`inset(0 ${(1-p)*100}% 0 0)`;cur.style.transform+=` translateX(${70*(1-p)}px)`;prev.style.opacity=1-p;}
else {let p=smooth(age/.42);cur.style.clipPath=`inset(0 ${(1-p)*100}% 0 0)`;prev.style.opacity=p>=1?0:1;}}else{cur.style.opacity=1;prev.style.opacity=0;}
document.querySelector('#title').innerHTML=i>=0&&TITLES[i]?isolate(i===13&&t>=META.a_root_at?'از ĀN به A':TITLES[i]):'';document.querySelector('#title').style.opacity=i>=0&&TITLES[i]?1:0;document.querySelector('#title').style.fontSize=document.querySelector('#title').innerText.length>27?'50px':'60px';{const h=document.querySelector('#title');let f=parseFloat(h.style.fontSize);while(h.scrollHeight>h.clientHeight+1&&f>42){f-=2;h.style.fontSize=f+'px';}}
const c=CUES.find(c=>t>=c.t0-0.000001&&t<c.t1-0.000001);document.querySelector('#caption').style.opacity=c?1:0;
if(c){const fa=document.querySelector('#fa');fa.dir=/[\u0600-\u06ff]/.test(c.text)?'rtl':'ltr';fa.innerHTML=isolate(c.text);let en=document.querySelector('#en');en.textContent=c.en;en.style.display='none';}
};
Promise.all([document.fonts.load('46px Arabic'),document.fonts.load('27px Latin'),new Promise(r=>{let im=new Image;im.onload=r;im.onerror=r;im.src='paper.jpg'})]).then(()=>{window.render(0);window.READY=true});
</script>
